<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empire Builder - نقشه واقعی جهان</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif; user-select:none; }
  body { background:#0a0e17; color:#e0e0e0; overflow:hidden; height:100vh; }

  /* ===== صفحه انتخاب کشور ===== */
  #selectScreen {
    position:fixed; inset:0; background:radial-gradient(circle at center,#14243d,#050810);
    display:flex; flex-direction:column; z-index:100; transition:opacity .6s;
  }
  #selectHeader { padding:18px; text-align:center; background:#0a1220dd; border-bottom:1px solid #263238; }
  #selectHeader h1 { font-size:1.8rem; color:#ffd54f; text-shadow:0 0 20px #ffb30055; }
  #selectHeader p { color:#90a4ae; font-size:.85rem; margin-top:4px; }
  #mapContainer { flex:1; position:relative; overflow:hidden; background:#0d1622; }
  #mapContainer svg { width:100%; height:100%; display:block; }

  .countryHit {
    fill:#2e4a3a; stroke:#1a2634; stroke-width:0.8; cursor:pointer;
    transition:fill .15s, filter .15s;
  }
  .countryHit:hover { fill:#ffd54f !important; filter:drop-shadow(0 0 6px #ffd54f); }

  #tooltip {
    position:absolute; background:#0f1622f0; border:1px solid #ffd54f;
    border-radius:8px; padding:6px 12px; pointer-events:none; font-size:.85rem;
    display:none; z-index:50; color:#ffd54f; font-weight:700; white-space:nowrap;
    box-shadow:0 4px 12px #000a;
  }

  /* ===== صفحه بازی ===== */
  #game { display:none; height:100vh; position:relative; }
  #gameMap { position:absolute; inset:0; background:#0d1622; }
  #gameMap svg { width:100%; height:100%; }
  .gameCountry { fill:#2e4a3a; stroke:#1a2634; stroke-width:0.8; }
  .gameCountry.home { fill:#ffd54f; filter:drop-shadow(0 0 8px #ffd54f); }

  #flagBox {
    position:absolute; top:14px; left:14px; z-index:20;
    background:#0f1622ee; border:1px solid #ffd54f88; border-radius:12px;
    padding:10px 16px; display:flex; align-items:center; gap:12px;
    backdrop-filter:blur(8px); box-shadow:0 4px 20px #0008;
  }
  #flagBox .flag { font-size:2.2rem; line-height:1; }
  #flagBox .info .name { font-weight:700; color:#ffd54f; font-size:1rem; }
  #flagBox .info .bonus { font-size:.72rem; color:#90a4ae; }

  #timeBar {
    position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:20;
    background:#0f1622f0; border:1px solid #2c3e50; border-radius:14px;
    padding:8px 14px; display:flex; align-items:center; gap:6px;
    backdrop-filter:blur(8px); box-shadow:0 4px 20px #0008;
  }
  #dateDisplay {
    font-weight:700; font-size:1rem; color:#e3f2fd; min-width:140px;
    text-align:center; padding:0 8px; transition:color .2s;
  }
  #dateDisplay.tick { color:#ffd54f; }
  .speedBtn {
    background:#182233; border:1px solid #2c3e50; color:#90a4ae; border-radius:8px;
    padding:6px 11px; cursor:pointer; font-size:.9rem; transition:.15s; font-weight:700;
  }
  .speedBtn:hover { border-color:#ffd54f; color:#ffd54f; }
  .speedBtn.active { background:#ffd54f; color:#0a0e17; border-color:#ffd54f; }

  #resources {
    position:absolute; top:14px; right:14px; z-index:20;
    background:#0f1622f0; border:1px solid #2c3e50; border-radius:12px;
    padding:12px 16px; min-width:210px; backdrop-filter:blur(8px); box-shadow:0 4px 20px #0008;
  }
  #resources .row { display:flex; justify-content:space-between; margin:5px 0; font-size:.88rem; }
  #resources .row span:last-child { color:#ffd54f; font-weight:700; transition:color .3s; }
  #resources .row span:last-child.flash { color:#66bb6a; }
  #resources .row.income span:last-child { color:#66bb6a; }

  #bottomPanel {
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%); z-index:20;
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
  }
  .actionBtn {
    background:#182233f0; border:1px solid #2c3e50; color:#e0e0e0;
    border-radius:12px; padding:11px 20px; cursor:pointer; font-size:.9rem;
    transition:.15s; backdrop-filter:blur(8px); font-weight:600; box-shadow:0 4px 16px #0008;
  }
  .actionBtn:hover:not(:disabled) { border-color:#ffd54f; color:#ffd54f; transform:translateY(-2px); }
  .actionBtn:disabled { opacity:.35; cursor:not-allowed; }
  .actionBtn.primary { border-color:#ffd54f; color:#ffd54f; }

  #assetsPanel {
    position:absolute; bottom:76px; right:14px; z-index:20; width:270px; max-height:45vh;
    overflow-y:auto; background:#0f1622f0; border:1px solid #2c3e50; border-radius:12px;
    padding:14px; display:none; backdrop-filter:blur(8px); box-shadow:0 4px 20px #0008;
  }
  #assetsPanel h3 { color:#ffd54f; margin-bottom:10px; font-size:.95rem; }
  .assetItem { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid #1e2a3a; font-size:.83rem; }
  .assetItem:last-child { border:none; }
  .assetItem .income { color:#66bb6a; font-weight:700; }
  .empty { color:#78909c; font-size:.83rem; text-align:center; padding:10px 0; }

  #modal {
    position:fixed; inset:0; background:#000a; z-index:200;
    display:none; align-items:center; justify-content:center;
  }
  #modal .box {
    background:#101a28; border:1px solid #ffd54f66; border-radius:16px;
    padding:26px; width:420px; max-width:92vw; box-shadow:0 10px 40px #000;
  }
  #modal h2 { color:#ffd54f; margin-bottom:18px; font-size:1.2rem; }
  .companyOption {
    background:#182233; border:1px solid #2c3e50; border-radius:10px;
    padding:14px; margin-bottom:10px; cursor:pointer; transition:.15s;
  }
  .companyOption:hover { border-color:#ffd54f; background:#233149; transform:translateX(-4px); }
  .companyOption .title { font-weight:700; margin-bottom:4px; color:#e3f2fd; }
  .companyOption .desc { font-size:.78rem; color:#90a4ae; }
  #modal .close {
    margin-top:12px; background:#263238; color:#e0e0e0; border:none;
    border-radius:8px; padding:12px; width:100%; cursor:pointer; font-weight:600;
  }
  #modal .close:hover { background:#37474f; }

  #toast {
    position:fixed; top:80px; left:50%; transform:translateX(-50%);
    background:#ffd54f; color:#0a0e17; padding:12px 24px; border-radius:10px;
    font-weight:700; z-index:300; opacity:0; transition:.3s; pointer-events:none;
    box-shadow:0 6px 24px #ffd54f44;
  }
  #toast.show { opacity:1; }
  #toast.error { background:#ef5350; color:#fff; box-shadow:0 6px 24px #ef535044; }

  /* لودینگ */
  #loading {
    position:fixed; inset:0; background:#0a0e17; display:flex;
    align-items:center; justify-content:center; z-index:500; flex-direction:column; gap:16px;
  }
  #loading .spinner {
    width:48px; height:48px; border:4px solid #263238; border-top-color:#ffd54f;
    border-radius:50%; animation:spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loading p { color:#90a4ae; font-size:.9rem; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>در حال بارگذاری نقشه جهان...</p>
</div>

<!-- ===== صفحه انتخاب کشور ===== -->
<div id="selectScreen" style="display:none;">
  <div id="selectHeader">
    <h1>🌍 EMPIRE BUILDER</h1>
    <p>روی نقشه، روی کشور خود کلیک کنید</p>
  </div>
  <div id="mapContainer">
    <svg id="worldMap" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
      <rect width="1000" height="500" fill="#0d1622"/>
      <g id="countriesLayer"></g>
    </svg>
    <div id="tooltip"></div>
  </div>
</div>

<!-- ===== صفحه بازی ===== -->
<div id="game">
  <div id="gameMap">
    <svg id="gameSvg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid slice">
      <rect width="1000" height="500" fill="#0d1622"/>
      <g id="gameCountriesLayer"></g>
    </svg>
  </div>

  <div id="flagBox">
    <span class="flag" id="flagIcon">🏳️</span>
    <div class="info">
      <div class="name" id="flagName">—</div>
      <div class="bonus" id="flagBonus">—</div>
    </div>
  </div>

  <div id="timeBar">
    <button class="speedBtn" data-speed="0" title="توقف">⏸</button>
    <button class="speedBtn active" data-speed="1">۱x</button>
    <button class="speedBtn" data-speed="2">۲x</button>
    <button class="speedBtn" data-speed="4">۴x</button>
    <button class="speedBtn" data-speed="8">۸x</button>
    <div id="dateDisplay">۱ ژانویه ۱۸۳۶</div>
  </div>

  <div id="resources">
    <div class="row"><span>💰 پول</span><span id="money">۱۰,۰۰۰</span></div>
    <div class="row"><span>🏭 کمپانی</span><span id="companyName">—</span></div>
    <div class="row"><span>⛏ دارایی‌ها</span><span id="assetCount">۰</span></div>
    <div class="row income"><span>📈 درآمد/ماه</span><span id="income">۰</span></div>
  </div>

  <div id="bottomPanel">
    <button class="actionBtn primary" id="buildCompanyBtn">🏗 ساخت کمپانی</button>
    <button class="actionBtn" id="buyMineBtn" disabled>⛏ خرید معدن (۵,۰۰۰)</button>
    <button class="actionBtn" id="upgradeBtn" disabled>⬆ ارتقاء</button>
    <button class="actionBtn" id="assetsToggleBtn" disabled>📋 دارایی‌ها</button>
  </div>

  <div id="assetsPanel">
    <h3>📋 دارایی‌های شما</h3>
    <div id="assetsList"></div>
  </div>
</div>

<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script>
/* ============================================================
   بارگذاری نقشه واقعی از CDN (Natural Earth 110m، از طریق world-atlas)
   داده‌ها: TopoJSON، نیاز به topojson-client برای تبدیل دارد
   ============================================================ */
const MAP_URL = 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json';
const TOPO_URL = 'https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js';

/* ============================================================
   اطلاعات کشورها (نام فارسی، پرچم، بونوس)
   با کد ISO Alpha-2 مطابقت داده می‌شود
   ============================================================ */
const COUNTRY_INFO = {
  ir: { name:'ایران', flag:'🇮🇷', bonus:'نفت +۲۰٪' },
  us: { name:'آمریکا', flag:'🇺🇸', bonus:'صنعت +۲۵٪' },
  de: { name:'آلمان', flag:'🇩🇪', bonus:'تکنولوژی +۳۰٪' },
  gb: { name:'انگلستان', flag:'🇬🇧', bonus:'تجارت +۲۰٪' },
  fr: { name:'فرانسه', flag:'🇫🇷', bonus:'کشاورزی +۲۰٪' },
  ru: { name:'روسیه', flag:'🇷🇺', bonus:'معدن +۲۵٪' },
  cn: { name:'چین', flag:'🇨🇳', bonus:'تولید +۳۰٪' },
  jp: { name:'ژاپن', flag:'🇯🇵', bonus:'تکنولوژی +۲۵٪' },
  in: { name:'هند', flag:'🇮🇳', bonus:'نیروی کار +۲۰٪' },
  br: { name:'برزیل', flag:'🇧🇷', bonus:'کشاورزی +۲۵٪' },
  ca: { name:'کانادا', flag:'🇨🇦', bonus:'معدن +۲۰٪' },
  au: { name:'استرالیا', flag:'🇦🇺', bonus:'معدن +۳۰٪' },
  tr: { name:'ترکیه', flag:'🇹🇷', bonus:'تجارت +۱۵٪' },
  eg: { name:'مصر', flag:'🇪🇬', bonus:'تجارت +۱۵٪' },
  sa: { name:'عربستان', flag:'🇸🇦', bonus:'نفت +۳۰٪' },
  kr: { name:'کره جنوبی', flag:'🇰🇷', bonus:'تکنولوژی +۲۵٪' },
  za: { name:'آفریقای جنوبی', flag:'🇿🇦', bonus:'معدن +۲۵٪' },
  mx: { name:'مکزیک', flag:'🇲🇽', bonus:'نفت +۱۵٪' },
  it: { name:'ایتالیا', flag:'🇮🇹', bonus:'تجارت +۱۵٪' },
  es: { name:'اسپانیا', flag:'🇪🇸', bonus:'کشاورزی +۱۵٪' },
  ar: { name:'آرژانتین', flag:'🇦🇷', bonus:'کشاورزی +۲۰٪' },
  id: { name:'اندونزی', flag:'🇮🇩', bonus:'نیروی کار +۲۰٪' },
  ng: { name:'نیجریه', flag:'🇳🇬', bonus:'نفت +۲۰٪' },
  pk: { name:'پاکستان', flag:'🇵🇰', bonus:'نیروی کار +۱۵٪' },
};

/* ============================================================
   انواع کمپانی
   ============================================================ */
const COMPANIES = [
  { id:'mining', title:'⛏ شرکت معدنی',   desc:'درآمد پایه ۱۵۰/ماه — می‌توانید معدن بخرید', baseIncome:150, canBuyMine:true,  upgradeCost:8000 },
  { id:'oil',    title:'🛢 شرکت نفتی',    desc:'درآمد پایه ۲۲۰/ماه — می‌توانید چاه نفت بخرید', baseIncome:220, canBuyMine:true,  upgradeCost:12000 },
  { id:'tech',   title:'💻 شرکت فناوری',  desc:'درآمد پایه ۱۰۰/ماه — قابل ارتقاء تا سطح بالا', baseIncome:100, canBuyMine:false, upgradeCost:6000 },
  { id:'trade',  title:'🚢 شرکت تجاری',   desc:'درآمد پایه ۱۸۰/ماه — درآمد پایدار', baseIncome:180, canBuyMine:false, upgradeCost:9000 },
];

/* ============================================================
   وضعیت بازی
   ============================================================ */
const state = {
  country: null,
  money: 10000,
  company: null,
  assets: [],
  date: new Date(1836, 0, 1),
  speed: 1,
  running: true,
  msPerMonth: 2000,      // هر ماه چقدر طول بکشد (1x)
  timeAccumulator: 0,
  lastFrame: 0,
  mapData: null,          // { iso2: pathD }
};

/* ============================================================
   بارگذاری topojson-client و داده نقشه
   ============================================================ */
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function initMap() {
  await loadScript(TOPO_URL);
  const topo = await fetch(MAP_URL).then(r => r.json());

  // تبدیل TopoJSON به GeoJSON
  const geo = topojson.feature(topo, topo.objects.countries);

  // تصویربرداری ساده equirectangular
  // داده Natural Earth مختصات [lon, lat] دارد
  const W = 1000, H = 500;
  const project = (lon, lat) => {
    const x = (lon + 180) / 360 * W;
    const y = (90 - lat) / 180 * H;
    return [x, y];
  };

  const paths = {}; // iso2 -> pathD (یا name -> pathD)

  geo.features.forEach(f => {
    const iso2 = (f.id || '').toLowerCase();
    // فیلتر قطب جنوب (خیلی بزرگ است)
    if (iso2 === 'aq' || iso2 === '010') return;

    const geom = f.geometry;
    if (!geom) return;

    let d = '';
    const coords = geom.type === 'Polygon' ? [geom.coordinates] :
                   geom.type === 'MultiPolygon' ? geom.coordinates : [];

    coords.forEach(polygon => {
      polygon.forEach(ring => {
        ring.forEach((pt, i) => {
          const [x, y] = project(pt[0], pt[1]);
          d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
        });
        d += 'Z';
      });
    });

    if (d) paths[iso2] = d;
  });

  state.mapData = paths;
  renderSelectMap();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('selectScreen').style.display = 'flex';
}

/* ============================================================
   رندر نقشه انتخاب کشور
   ============================================================ */
function renderSelectMap() {
  const layer = document.getElementById('countriesLayer');
  layer.innerHTML = '';
  const tooltip = document.getElementById('tooltip');
  const container = document.getElementById('mapContainer');

  Object.entries(state.mapData).forEach(([iso2, d]) => {
    const info = COUNTRY_INFO[iso2];
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    p.setAttribute('class', 'countryHit');
    p.dataset.iso = iso2;

    if (info) {
      p.addEventListener('mouseenter', () => {
        tooltip.style.display = 'block';
        tooltip.textContent = `${info.flag} ${info.name} — ${info.bonus}`;
      });
      p.addEventListener('mousemove', e => {
        const rect = container.getBoundingClientRect();
        tooltip.style.left = (e.clientX - rect.left + 14) + 'px';
        tooltip.style.top  = (e.clientY - rect.top  + 14) + 'px';
      });
      p.addEventListener('mouseleave', () => tooltip.style.display = 'none');
      p.addEventListener('click', () => selectCountry(iso2));
    }
    layer.appendChild(p);
  });
}

/* ============================================================
   انتخاب کشور
   ============================================================ */
function selectCountry(iso2) {
  const info = COUNTRY_INFO[iso2];
  if (!info) return;

  state.country = { iso: iso2, ...info };

  document.getElementById('flagIcon').textContent = info.flag;
  document.getElementById('flagName').textContent = info.name;
  document.getElementById('flagBonus').textContent = info.bonus;

  // رندر نقشه بازی
  const gameLayer = document.getElementById('gameCountriesLayer');
  gameLayer.innerHTML = '';
  Object.entries(state.mapData).forEach(([iso, d]) => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    p.setAttribute('class', 'gameCountry' + (iso === iso2 ? ' home' : ''));
    gameLayer.appendChild(p);
  });

  const ss = document.getElementById('selectScreen');
  ss.style.opacity = '0';
  setTimeout(() => {
    ss.style.display = 'none';
    document.getElementById('game').style.display = 'block';
    updateUI();
    state.lastFrame = performance.now();
    requestAnimationFrame(gameLoop);
  }, 500);
}

/* ============================================================
   مودال
   ============================================================ */
const modal = document.getElementById('modal');
const modalBox = document.getElementById('modalBox');
function openModal(html) { modalBox.innerHTML = html; modal.style.display = 'flex'; }
function closeModal() { modal.style.display = 'none'; }
modal.onclick = e => { if (e.target === modal) closeModal(); };

/* ============================================================
   ساخت کمپانی
   ============================================================ */
document.getElementById('buildCompanyBtn').onclick = () => {
  if (state.company) { toast('شما قبلاً کمپانی دارید!', true); return; }
  let html = `<h2>🏗 انتخاب نوع کمپانی</h2>`;
  COMPANIES.forEach(c => {
    html += `<div class="companyOption" onclick="createCompany('${c.id}')">
      <div class="title">${c.title}</div>
      <div class="desc">${c.desc}</div>
    </div>`;
  });
  html += `<button class="close" onclick="closeModal()">انصراف</button>`;
  openModal(html);
};

function createCompany(id) {
  const def = COMPANIES.find(c => c.id === id);
  state.company = { ...def, level: 1 };
  closeModal();

  document.getElementById('buildCompanyBtn').disabled = true;
  document.getElementById('assetsToggleBtn').disabled = false;
  document.getElementById('upgradeBtn').disabled = false;

  if (def.canBuyMine) {
    document.getElementById('buyMineBtn').disabled = false;
    document.getElementById('buyMineBtn').textContent =
      def.id === 'oil' ? '🛢 خرید چاه نفت (۵,۰۰۰)' : '⛏ خرید معدن (۵,۰۰۰)';
  } else {
    document.getElementById('buyMineBtn').disabled = true;
    document.getElementById('buyMineBtn').textContent = '⛏ خرید معدن (نیاز به شرکت معدنی)';
  }

  toast(`کمپانی ${def.title} ساخته شد!`);
  updateUI();
}

/* ============================================================
   خرید معدن
   ============================================================ */
const MINE_COST = 5000;
document.getElementById('buyMineBtn').onclick = () => {
  if (!state.company || !state.company.canBuyMine) {
    toast('فقط شرکت معدنی/نفتی می‌تواند معدن بخرد', true);
    return;
  }
  if (state.money < MINE_COST) { toast('پول کافی ندارید!', true); return; }
  state.money -= MINE_COST;
  const income = Math.floor(80 + Math.random() * 120);
  const label = state.company.id === 'oil' ? 'چاه نفت' : 'معدن';
  state.assets.push({ income, type: label, id: Date.now() });
  toast(`${label} جدید خریداری شد! (+${income}/ماه)`);
  updateUI();
};

/* ============================================================
   ارتقاء
   ============================================================ */
document.getElementById('upgradeBtn').onclick = () => {
  if (!state.company) return;
  const cost = state.company.upgradeCost * state.company.level;
  if (state.money < cost) { toast(`پول کافی ندارید! نیاز: ${cost.toLocaleString('en-US')}`, true); return; }
  state.money -= cost;
  state.company.level += 1;
  toast(`کمپانی به سطح ${state.company.level} ارتقاء یافت!`);
  updateUI();
};

/* ============================================================
   پنل دارایی‌ها
   ============================================================ */
document.getElementById('assetsToggleBtn').onclick = () => {
  const p = document.getElementById('assetsPanel');
  p.style.display = p.style.display === 'block' ? 'none' : 'block';
  renderAssets();
};

function renderAssets() {
  const list = document.getElementById('assetsList');
  if (state.assets.length === 0) {
    list.innerHTML = `<div class="empty">هنوز دارایی‌ای ندارید.</div>`;
    return;
  }
  list.innerHTML = state.assets.map((a, i) =>
    `<div class="assetItem"><span>${a.type} #${i+1}</span><span class="income">+${a.income}/ماه</span></div>`
  ).join('');
}

/* ============================================================
   کنترل سرعت زمان
   ============================================================ */
document.querySelectorAll('.speedBtn').forEach(btn => {
  btn.onclick = () => {
    const s = parseInt(btn.dataset.speed);
    if (s === 0) {
      state.running = !state.running;
      btn.classList.toggle('active', !state.running);
      btn.textContent = state.running ? '⏸' : '▶';
      return;
    }
    state.speed = s;
    state.running = true;
    document.querySelector('[data-speed="0"]').textContent = '⏸';
    document.querySelector('[data-speed="0"]').classList.remove('active');
    document.querySelectorAll('.speedBtn').forEach(b => {
      if (b.dataset.speed !== '0') b.classList.remove('active');
    });
    btn.classList.add('active');
    state.timeAccumulator = 0;
  };
});

/* ============================================================
   حلقه بازی — زمان همیشه می‌گذرد (مگر در حالت توقف)
   ============================================================ */
function gameLoop(now) {
  const dt = now - state.lastFrame;
  state.lastFrame = now;

  // زمان مستقل از وجود شرکت پیش می‌رود
  if (state.running) {
    state.timeAccumulator += dt * state.speed;
    const monthDur = state.msPerMonth;
    while (state.timeAccumulator >= monthDur) {
      state.timeAccumulator -= monthDur;
      advanceMonth();
    }
  }
  requestAnimationFrame(gameLoop);
}

function advanceMonth() {
  state.date.setMonth(state.date.getMonth() + 1);

  // درآمد فقط اگر شرکت وجود داشته باشد
  let income = 0;
  if (state.company) {
    income += state.company.baseIncome * state.company.level;
    state.assets.forEach(a => income += a.income);
  }

  if (income > 0) {
    state.money += income;
    flashMoney();
  }

  // انیمیشن تاریخ
  const dateEl = document.getElementById('dateDisplay');
  dateEl.classList.add('tick');
  setTimeout(() => dateEl.classList.remove('tick'), 200);

  updateUI();
}

function flashMoney() {
  const el = document.getElementById('money');
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 300);
}

/* ============================================================
   به‌روزرسانی UI
   ============================================================ */
const monthsFa = ['ژانویه','فوریه','مارس','آپریل','مه','ژوئن','ژوئیه','اوت','سپتامبر','اکتبر','نوامبر','دسامبر'];
const toFa = n => n.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

function updateUI() {
  document.getElementById('money').textContent = toFa(state.money.toLocaleString('en-US'));
  document.getElementById('companyName').textContent = state.company ? state.company.title : '—';
  document.getElementById('assetCount').textContent = toFa(state.assets.length);

  let income = 0;
  if (state.company) {
    income += state.company.baseIncome * state.company.level;
    state.assets.forEach(a => income += a.income);
  }
  document.getElementById('income').textContent = toFa(income.toLocaleString('en-US'));

  const d = state.date;
  document.getElementById('dateDisplay').textContent =
    `${toFa(d.getDate())} ${monthsFa[d.getMonth()]} ${toFa(d.getFullYear())}`;

  if (state.company) {
    const cost = state.company.upgradeCost * state.company.level;
    document.getElementById('upgradeBtn').textContent =
      `⬆ ارتقاء (${toFa(cost.toLocaleString('en-US'))})`;
  }
}

/* ============================================================
   توست
   ============================================================ */
let toastTimer;
function toast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', isError);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

/* ============================================================
   کیبورد
   ============================================================ */
document.addEventListener('keydown', e => {
  if (document.getElementById('game').style.display !== 'block') return;
  if (e.code === 'Space') { e.preventDefault(); document.querySelector('[data-speed="0"]').click(); }
  if (e.key === '1') document.querySelector('[data-speed="1"]').click();
  if (e.key === '2') document.querySelector('[data-speed="2"]').click();
  if (e.key === '3') document.querySelector('[data-speed="4"]').click();
  if (e.key === '4') document.querySelector('[data-speed="8"]').click();
});

/* ============================================================
   شروع
   ============================================================ */
window.createCompany = createCompany;
window.closeModal = closeModal;

initMap().catch(err => {
  document.getElementById('loading').innerHTML =
    `<p style="color:#ef5350">خطا در بارگذاری نقشه: ${err.message}</p>
     <p style="color:#90a4ae;font-size:.8rem">اتصال اینترنت را بررسی کنید</p>`;
});
</script>
