<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empire Builder</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif; user-select:none; }
  body { background:#0a0e17; color:#e0e0e0; overflow:hidden; height:100vh; }

  /* ===== صفحه انتخاب کشور ===== */
  #selectScreen {
    position:fixed; inset:0; background:radial-gradient(circle at center,#14243d,#050810);
    display:flex; flex-direction:column; z-index:100; transition:opacity .6s;
  }
  #selectHeader {
    padding:20px; text-align:center; background:#0a1220cc;
    border-bottom:1px solid #263238;
  }
  #selectHeader h1 { font-size:2rem; color:#ffd54f; text-shadow:0 0 20px #ffb30055; }
  #selectHeader p { color:#90a4ae; font-size:.9rem; margin-top:4px; }
  #mapContainer { flex:1; position:relative; overflow:hidden; }
  #mapContainer svg { width:100%; height:100%; display:block; }

  .countryHit {
    fill:#2e4a3a; stroke:#1a2634; stroke-width:1.5; cursor:pointer;
    transition:fill .2s, filter .2s;
  }
  .countryHit:hover { fill:#ffd54f !important; filter:drop-shadow(0 0 8px #ffd54f); }

  #tooltip {
    position:absolute; background:#0f1622ee; border:1px solid #ffd54f;
    border-radius:8px; padding:6px 12px; pointer-events:none; font-size:.85rem;
    display:none; z-index:50; color:#ffd54f; font-weight:700;
  }

  /* ===== صفحه بازی ===== */
  #game { display:none; height:100vh; position:relative; }
  #gameMap { position:absolute; inset:0; background:#0d1622; }
  #gameMap svg { width:100%; height:100%; }
  .gameCountry { fill:#2e4a3a; stroke:#1a2634; stroke-width:1.5; }
  .gameCountry.home { fill:#ffd54f; filter:drop-shadow(0 0 12px #ffd54f); }

  /* پرچم گوشه بالا چپ */
  #flagBox {
    position:absolute; top:16px; left:16px; z-index:20;
    background:#0f1622ee; border:1px solid #ffd54f88; border-radius:12px;
    padding:10px 16px; display:flex; align-items:center; gap:12px;
    backdrop-filter:blur(8px); box-shadow:0 4px 20px #0008;
  }
  #flagBox .flag { font-size:2.2rem; line-height:1; }
  #flagBox .info .name { font-weight:700; color:#ffd54f; font-size:1rem; }
  #flagBox .info .bonus { font-size:.75rem; color:#90a4ae; }

  /* نوار زمان بالای وسط */
  #timeBar {
    position:absolute; top:16px; left:50%; transform:translateX(-50%); z-index:20;
    background:#0f1622f0; border:1px solid #2c3e50; border-radius:14px;
    padding:8px 14px; display:flex; align-items:center; gap:8px;
    backdrop-filter:blur(8px); box-shadow:0 4px 20px #0008;
  }
  #dateDisplay { font-weight:700; font-size:1rem; color:#e3f2fd; min-width:130px; text-align:center; padding:0 8px; }
  .speedBtn {
    background:#182233; border:1px solid #2c3e50; color:#90a4ae; border-radius:8px;
    padding:6px 11px; cursor:pointer; font-size:.9rem; transition:.15s; font-weight:700;
  }
  .speedBtn:hover { border-color:#ffd54f; color:#ffd54f; }
  .speedBtn.active { background:#ffd54f; color:#0a0e17; border-color:#ffd54f; }

  /* منابع گوشه بالا راست */
  #resources {
    position:absolute; top:16px; right:16px; z-index:20;
    background:#0f1622f0; border:1px solid #2c3e50; border-radius:12px;
    padding:12px 16px; min-width:210px; backdrop-filter:blur(8px); box-shadow:0 4px 20px #0008;
  }
  #resources .row { display:flex; justify-content:space-between; margin:5px 0; font-size:.9rem; }
  #resources .row span:last-child { color:#ffd54f; font-weight:700; }
  #resources .row.income span:last-child { color:#66bb6a; }

  /* دکمه‌های پایین */
  #bottomPanel {
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%); z-index:20;
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
  }
  .actionBtn {
    background:#182233f0; border:1px solid #2c3e50; color:#e0e0e0;
    border-radius:12px; padding:12px 22px; cursor:pointer; font-size:.95rem;
    transition:.15s; backdrop-filter:blur(8px); font-weight:600; box-shadow:0 4px 16px #0008;
  }
  .actionBtn:hover:not(:disabled) { border-color:#ffd54f; color:#ffd54f; transform:translateY(-2px); }
  .actionBtn:disabled { opacity:.35; cursor:not-allowed; }
  .actionBtn.primary { border-color:#ffd54f; color:#ffd54f; }

  /* پنل معادن/ارتقاء */
  #minesPanel {
    position:absolute; bottom:80px; right:16px; z-index:20; width:270px; max-height:45vh;
    overflow-y:auto; background:#0f1622f0; border:1px solid #2c3e50; border-radius:12px;
    padding:14px; display:none; backdrop-filter:blur(8px); box-shadow:0 4px 20px #0008;
  }
  #minesPanel h3 { color:#ffd54f; margin-bottom:10px; font-size:.95rem; }
  .mineItem { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #1e2a3a; font-size:.85rem; }
  .mineItem:last-child { border:none; }
  .mineItem .income { color:#66bb6a; font-weight:700; }
  .empty { color:#78909c; font-size:.85rem; text-align:center; padding:10px 0; }

  /* مودال */
  #modal {
    position:fixed; inset:0; background:#000a; z-index:200;
    display:none; align-items:center; justify-content:center;
  }
  #modal .box {
    background:#101a28; border:1px solid #ffd54f66; border-radius:16px;
    padding:26px; width:420px; max-width:92vw; box-shadow:0 10px 40px #000;
  }
  #modal h2 { color:#ffd54f; margin-bottom:18px; font-size:1.25rem; }
  .companyOption {
    background:#182233; border:1px solid #2c3e50; border-radius:10px;
    padding:14px; margin-bottom:10px; cursor:pointer; transition:.15s;
  }
  .companyOption:hover { border-color:#ffd54f; background:#233149; transform:translateX(-4px); }
  .companyOption .title { font-weight:700; margin-bottom:4px; color:#e3f2fd; }
  .companyOption .desc { font-size:.8rem; color:#90a4ae; }
  #modal .close {
    margin-top:12px; background:#263238; color:#e0e0e0; border:none;
    border-radius:8px; padding:12px; width:100%; cursor:pointer; font-weight:600;
  }
  #modal .close:hover { background:#37474f; }

  /* توست */
  #toast {
    position:fixed; top:80px; left:50%; transform:translateX(-50%);
    background:#ffd54f; color:#0a0e17; padding:12px 24px; border-radius:10px;
    font-weight:700; z-index:300; opacity:0; transition:.3s; pointer-events:none;
    box-shadow:0 6px 24px #ffd54f44;
  }
  #toast.show { opacity:1; }
  #toast.error { background:#ef5350; color:#fff; box-shadow:0 6px 24px #ef535044; }
</style>
</head>
<body>

<!-- ===== صفحه انتخاب کشور ===== -->
<div id="selectScreen">
  <div id="selectHeader">
    <h1>🌍 EMPIRE BUILDER</h1>
    <p>روی نقشه، کشور خود را انتخاب کنید</p>
  </div>
  <div id="mapContainer">
    <svg id="worldMap" viewBox="0 0 2000 1000" preserveAspectRatio="xMidYMid meet">
      <rect width="2000" height="1000" fill="#0d1622"/>
      <!-- اقیانوس و خطوط -->
      <g id="countriesLayer"></g>
    </svg>
    <div id="tooltip"></div>
  </div>
</div>

<!-- ===== صفحه بازی ===== -->
<div id="game">
  <div id="gameMap">
    <svg id="gameSvg" viewBox="0 0 2000 1000" preserveAspectRatio="xMidYMid slice">
      <rect width="2000" height="1000" fill="#0d1622"/>
      <g id="gameCountriesLayer"></g>
    </svg>
  </div>

  <div id="flagBox">
    <span class="flag" id="flagIcon">🏳️</span>
    <div class="info">
      <div class="name" id="flagName">—</div>
      <div class="bonus" id="flagBonus">—</div>
    </div>
  </div>

  <div id="timeBar">
    <button class="speedBtn" data-speed="0" title="توقف">⏸</button>
    <button class="speedBtn active" data-speed="1">۱x</button>
    <button class="speedBtn" data-speed="2">۲x</button>
    <button class="speedBtn" data-speed="4">۴x</button>
    <button class="speedBtn" data-speed="8">۸x</button>
    <div id="dateDisplay">۱ ژانویه ۱۸۳۶</div>
  </div>

  <div id="resources">
    <div class="row"><span>💰 پول</span><span id="money">۱۰,۰۰۰</span></div>
    <div class="row"><span>🏭 کمپانی</span><span id="companyName">—</span></div>
    <div class="row"><span>⛏ دارایی‌ها</span><span id="assetCount">۰</span></div>
    <div class="row income"><span>📈 درآمد/ماه</span><span id="income">۰</span></div>
  </div>

  <div id="bottomPanel">
    <button class="actionBtn primary" id="buildCompanyBtn">🏗 ساخت کمپانی</button>
    <button class="actionBtn" id="buyMineBtn" disabled>⛏ خرید معدن (۵,۰۰۰)</button>
    <button class="actionBtn" id="upgradeBtn" disabled>⬆ ارتقاء کمپانی</button>
    <button class="actionBtn" id="minesToggleBtn" disabled>📋 دارایی‌ها</button>
  </div>

  <div id="minesPanel">
    <h3 id="minesPanelTitle">📋 دارایی‌های شما</h3>
    <div id="minesList"></div>
  </div>
</div>

<div id="modal">
  <div class="box" id="modalBox"></div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   داده‌های کشورها با مسیر SVG ساده‌شده (نقشه جهان)
   ============================================================ */
const COUNTRIES = [
  { id:'iran',   name:'ایران',     flag:'🇮🇷', bonus:'نفت +۲۰٪',   path:'M1090,420 L1150,400 L1180,440 L1160,490 L1100,480 Z' },
  { id:'usa',    name:'آمریکا',    flag:'🇺🇸', bonus:'صنعت +۲۵٪',  path:'M420,300 L620,290 L650,380 L600,450 L450,440 L400,370 Z' },
  { id:'germany',name:'آلمان',     flag:'🇩🇪', bonus:'تکنولوژی +۳۰٪', path:'M1000,290 L1040,285 L1050,330 L1020,340 L990,325 Z' },
  { id:'uk',     name:'انگلستان',  flag:'🇬🇧', bonus:'تجارت +۲۰٪', path:'M950,280 L975,275 L980,310 L955,315 Z' },
  { id:'france', name:'فرانسه',    flag:'🇫🇷', bonus:'کشاورزی +۲۰٪', path:'M965,320 L1010,315 L1020,355 L980,365 L955,345 Z' },
  { id:'russia', name:'روسیه',     flag:'🇷🇺', bonus:'معدن +۲۵٪',  path:'M1050,180 L1450,160 L1520,260 L1400,300 L1150,280 L1060,250 Z' },
  { id:'china',  name:'چین',       flag:'🇨🇳', bonus:'تولید +۳۰٪', path:'M1380,350 L1520,340 L1560,420 L1480,470 L1390,440 Z' },
  { id:'japan',  name:'ژاپن',      flag:'🇯🇵', bonus:'تکنولوژی +۲۵٪', path:'M1600,380 L1630,375 L1640,420 L1610,430 Z' },
  { id:'india',  name:'هند',       flag:'🇮🇳', bonus:'نیروی کار +۲۰٪', path:'M1280,430 L1350,420 L1370,490 L1310,530 L1270,480 Z' },
  { id:'brazil', name:'برزیل',     flag:'🇧🇷', bonus:'کشاورزی +۲۵٪', path:'M650,520 L760,510 L790,600 L720,680 L640,640 Z' },
  { id:'canada', name:'کانادا',    flag:'🇨🇦', bonus:'معدن +۲۰٪',   path:'M400,200 L650,190 L680,270 L600,280 L420,280 Z' },
  { id:'australia',name:'استرالیا',flag:'🇦🇺', bonus:'معدن +۳۰٪',   path:'M1520,650 L1680,640 L1720,740 L1620,780 L1520,730 Z' },
  { id:'turkey', name:'ترکیه',     flag:'🇹🇷', bonus:'تجارت +۱۵٪',  path:'M1060,380 L1130,375 L1140,410 L1080,420 Z' },
  { id:'egypt',  name:'مصر',       flag:'🇪🇬', bonus:'تجارت +۱۵٪',  path:'M1080,440 L1130,435 L1140,490 L1090,495 Z' },
  { id:'saudi',  name:'عربستان',   flag:'🇸🇦', bonus:'نفت +۳۰٪',    path:'M1110,470 L1200,465 L1220,530 L1140,540 L1100,510 Z' },
  { id:'korea',  name:'کره جنوبی', flag:'🇰🇷', bonus:'تکنولوژی +۲۵٪', path:'M1560,390 L1590,385 L1600,420 L1570,425 Z' },
  { id:'southafrica',name:'آفریقای جنوبی',flag:'🇿🇦',bonus:'معدن +۲۵٪', path:'M1080,650 L1150,640 L1170,720 L1100,740 L1060,690 Z' },
  { id:'mexico', name:'مکزیک',     flag:'🇲🇽', bonus:'نفت +۱۵٪',    path:'M480,430 L540,425 L560,480 L510,500 L470,470 Z' },
];

/* ============================================================
   انواع کمپانی
   ============================================================ */
const COMPANIES = [
  { id:'mining', title:'⛏ شرکت معدنی',   desc:'درآمد پایه ۱۵۰/ماه — می‌توانید معدن بخرید', baseIncome:150, canBuyMine:true,  upgradeCost:8000 },
  { id:'oil',    title:'🛢 شرکت نفتی',    desc:'درآمد پایه ۲۲۰/ماه — می‌توانید چاه نفت بخرید', baseIncome:220, canBuyMine:true,  upgradeCost:12000 },
  { id:'tech',   title:'💻 شرکت فناوری',  desc:'درآمد پایه ۱۰۰/ماه — قابل ارتقاء تا سطح بالا', baseIncome:100, canBuyMine:false, upgradeCost:6000 },
  { id:'trade',  title:'🚢 شرکت تجاری',   desc:'درآمد پایه ۱۸۰/ماه — درآمد پایدار', baseIncome:180, canBuyMine:false, upgradeCost:9000 },
];

/* ============================================================
   وضعیت بازی
   ============================================================ */
const state = {
  country: null,
  money: 10000,
  company: null,
  assets: [],        // معادن / چاه‌ها
  date: new Date(1836, 0, 1),
  speed: 1,
  running: true,
  // زمان‌بندی: هر ماه چقدر طول بکشه (در حالت 1x)
  msPerMonth: 2000,
  // انباشته‌گر زمان
  timeAccumulator: 0,
  lastFrame: 0,
};

/* ============================================================
   ساخت نقشه انتخاب کشور
   ============================================================ */
const countriesLayer = document.getElementById('countriesLayer');
const tooltip = document.getElementById('tooltip');

COUNTRIES.forEach(c => {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', c.path);
  p.setAttribute('class', 'countryHit');
  p.dataset.id = c.id;
  p.addEventListener('mouseenter', e => {
    tooltip.style.display = 'block';
    tooltip.textContent = `${c.flag} ${c.name} — ${c.bonus}`;
  });
  p.addEventListener('mousemove', e => {
    const rect = document.getElementById('mapContainer').getBoundingClientRect();
    tooltip.style.left = (e.clientX - rect.left + 15) + 'px';
    tooltip.style.top  = (e.clientY - rect.top  + 15) + 'px';
  });
  p.addEventListener('mouseleave', () => tooltip.style.display = 'none');
  p.addEventListener('click', () => selectCountry(c));
  countriesLayer.appendChild(p);
});

/* ============================================================
   انتخاب کشور و شروع بازی
   ============================================================ */
function selectCountry(c) {
  state.country = c;

  // پرچم
  document.getElementById('flagIcon').textContent = c.flag;
  document.getElementById('flagName').textContent = c.name;
  document.getElementById('flagBonus').textContent = c.bonus;

  // نقشه بازی رو بساز
  const gameLayer = document.getElementById('gameCountriesLayer');
  gameLayer.innerHTML = '';
  COUNTRIES.forEach(ct => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', ct.path);
    p.setAttribute('class', 'gameCountry' + (ct.id === c.id ? ' home' : ''));
    gameLayer.appendChild(p);
  });

  // انتقال صفحه
  const ss = document.getElementById('selectScreen');
  ss.style.opacity = '0';
  setTimeout(() => {
    ss.style.display = 'none';
    document.getElementById('game').style.display = 'block';
    updateUI();
    state.lastFrame = performance.now();
    requestAnimationFrame(gameLoop);
  }, 500);
}

/* ============================================================
   مودال
   ============================================================ */
const modal = document.getElementById('modal');
const modalBox = document.getElementById('modalBox');
function openModal(html) { modalBox.innerHTML = html; modal.style.display = 'flex'; }
function closeModal() { modal.style.display = 'none'; }
modal.onclick = e => { if (e.target === modal) closeModal(); };

/* ============================================================
   ساخت کمپانی
   ============================================================ */
document.getElementById('buildCompanyBtn').onclick = () => {
  if (state.company) { toast('شما قبلاً کمپانی دارید!', true); return; }
  let html = `<h2>🏗 انتخاب نوع کمپانی</h2>`;
  COMPANIES.forEach(c => {
    html += `<div class="companyOption" onclick="createCompany('${c.id}')">
      <div class="title">${c.title}</div>
      <div class="desc">${c.desc}</div>
    </div>`;
  });
  html += `<button class="close" onclick="closeModal()">انصراف</button>`;
  openModal(html);
};

function createCompany(id) {
  const def = COMPANIES.find(c => c.id === id);
  state.company = { ...def, level: 1 };
  closeModal();

  document.getElementById('buildCompanyBtn').disabled = true;
  document.getElementById('minesToggleBtn').disabled = false;
  document.getElementById('upgradeBtn').disabled = false;

  if (def.canBuyMine) {
    document.getElementById('buyMineBtn').disabled = false;
    document.getElementById('buyMineBtn').textContent =
      def.id === 'oil' ? '🛢 خرید چاه نفت (۵,۰۰۰)' : '⛏ خرید معدن (۵,۰۰۰)';
  } else {
    document.getElementById('buyMineBtn').disabled = true;
    document.getElementById('buyMineBtn').textContent = '⛏ خرید معدن (نیاز به شرکت معدنی)';
  }

  toast(`کمپانی ${def.title} ساخته شد!`);
  updateUI();
}

/* ============================================================
   خرید معدن / چاه
   ============================================================ */
const MINE_COST = 5000;
document.getElementById('buyMineBtn').onclick = () => {
  if (!state.company || !state.company.canBuyMine) {
    toast('فقط شرکت معدنی/نفتی می‌تواند معدن بخرد', true);
    return;
  }
  if (state.money < MINE_COST) { toast('پول کافی ندارید!', true); return; }
  state.money -= MINE_COST;
  const income = Math.floor(80 + Math.random() * 120);
  const label = state.company.id === 'oil' ? 'چاه نفت' : 'معدن';
  state.assets.push({ income, type: label, id: Date.now() });
  toast(`${label} جدید خریداری شد! (+${income}/ماه)`);
  updateUI();
};

/* ============================================================
   ارتقاء کمپانی
   ============================================================ */
document.getElementById('upgradeBtn').onclick = () => {
  if (!state.company) return;
  const cost = state.company.upgradeCost * state.company.level;
  if (state.money < cost) { toast(`پول کافی ندارید! نیاز: ${cost.toLocaleString('en-US')}`, true); return; }
  state.money -= cost;
  state.company.level += 1;
  toast(`کمپانی به سطح ${state.company.level} ارتقاء یافت!`);
  updateUI();
};

/* ============================================================
   پنل دارایی‌ها
   ============================================================ */
document.getElementById('minesToggleBtn').onclick = () => {
  const p = document.getElementById('minesPanel');
  p.style.display = p.style.display === 'block' ? 'none' : 'block';
  renderAssets();
};

function renderAssets() {
  const list = document.getElementById('minesList');
  if (state.assets.length === 0) {
    list.innerHTML = `<div class="empty">هنوز دارایی‌ای ندارید.</div>`;
    return;
  }
  list.innerHTML = state.assets.map((a, i) =>
    `<div class="mineItem"><span>${a.type} #${i+1}</span><span class="income">+${a.income}/ماه</span></div>`
  ).join('');
}

/* ============================================================
   کنترل سرعت زمان
   ============================================================ */
document.querySelectorAll('.speedBtn').forEach(btn => {
  btn.onclick = () => {
    const s = parseInt(btn.dataset.speed);
    if (s === 0) {
      state.running = !state.running;
      btn.classList.toggle('active', !state.running);
      btn.textContent = state.running ? '⏸' : '▶';
      return;
    }
    state.speed = s;
    state.running = true;
    document.querySelector('[data-speed="0"]').textContent = '⏸';
    document.querySelector('[data-speed="0"]').classList.remove('active');
    document.querySelectorAll('.speedBtn').forEach(b => {
      if (b.dataset.speed !== '0') b.classList.remove('active');
    });
    btn.classList.add('active');
    // ریست انباشته‌گر برای شروع فوری
    state.timeAccumulator = 0;
  };
});

/* ============================================================
   حلقه اصلی بازی — زمان‌بندی درست
   ============================================================ */
function gameLoop(now) {
  const dt = now - state.lastFrame;
  state.lastFrame = now;

  if (state.running && state.company) {
    state.timeAccumulator += dt * state.speed;
    const monthDur = state.msPerMonth;
    while (state.timeAccumulator >= monthDur) {
      state.timeAccumulator -= monthDur;
      advanceMonth();
    }
  }
  requestAnimationFrame(gameLoop);
}

function advanceMonth() {
  state.date.setMonth(state.date.getMonth() + 1);

  let income = 0;
  if (state.company) {
    // درآمد پایه × سطح کمپانی
    income += state.company.baseIncome * state.company.level;
  }
  state.assets.forEach(a => income += a.income);

  state.money += income;
  updateUI();
}

/* ============================================================
   به‌روزرسانی UI
   ============================================================ */
const monthsFa = ['ژانویه','فوریه','مارس','آپریل','مه','ژوئن','ژوئیه','اوت','سپتامبر','اکتبر','نوامبر','دسامبر'];
const toFa = n => n.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

function updateUI() {
  document.getElementById('money').textContent = toFa(state.money.toLocaleString('en-US'));
  document.getElementById('companyName').textContent = state.company ? state.company.title : '—';
  document.getElementById('assetCount').textContent = toFa(state.assets.length);

  let income = 0;
  if (state.company) income += state.company.baseIncome * state.company.level;
  state.assets.forEach(a => income += a.income);
  document.getElementById('income').textContent = toFa(income.toLocaleString('en-US'));

  const d = state.date;
  document.getElementById('dateDisplay').textContent =
    `${toFa(d.getDate())} ${monthsFa[d.getMonth()]} ${toFa(d.getFullYear())}`;

  // دکمه ارتقاء
  if (state.company) {
    const cost = state.company.upgradeCost * state.company.level;
    document.getElementById('upgradeBtn').textContent =
      `⬆ ارتقاء (${toFa(cost.toLocaleString('en-US'))})`;
  }
}

/* ============================================================
   توست
   ============================================================ */
let toastTimer;
function toast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', isError);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

/* ============================================================
   کیبورد
   ============================================================ */
document.addEventListener('keydown', e => {
  if (document.getElementById('game').style.display !== 'block') return;
  if (e.code === 'Space') { e.preventDefault(); document.querySelector('[data-speed="0"]').click(); }
  if (e.key === '1') document.querySelector('[data-speed="1"]').click();
  if (e.key === '2') document.querySelector('[data-speed="2"]').click();
  if (e.key === '3') document.querySelector('[data-speed="4"]').click();
  if (e.key === '4') document.querySelector('[data-speed="8"]').click();
});

window.createCompany = createCompany;
window.closeModal = closeModal;
</script>
