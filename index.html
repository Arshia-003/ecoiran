<style>

  #selectHeader h1 { font-size:1.7rem; color:#ffd54f; text-shadow:0 0 20px #ffb30055; }
  #selectHeader p { color:#90a4ae; font-size:.82rem; margin-top:3px; }
  #mapContainer { flex:1; position:relative; overflow:hidden; background:#0d1622; cursor:grab; }
  #mapContainer.dragging { cursor:grabbing; }
  #mapContainer svg { width:100%; height:100%; display:block; }

  .countryHit {
    stroke:#0a0e17; stroke-width:0.5; cursor:pointer;
    transition:filter .15s, stroke .15s, stroke-width .15s;
  }
  .countryHit:hover { filter:brightness(1.6) drop-shadow(0 0 4px #fff); stroke:#ffd54f; stroke-width:1.2; }
  .countryHit.selectable { cursor:pointer; }

  .countryLabel {
    fill:#e0e0e0; font-size:5px; font-weight:700; pointer-events:none;
    text-anchor:middle; dominant-baseline:middle;
    paint-order:stroke; stroke:#0a0e17; stroke-width:1.2px; stroke-linejoin:round;
    opacity:0; transition:opacity .2s;
  }
  .countryLabel.visible { opacity:1; }

  #tooltip {
    position:absolute; background:#0f1622f0; border:1px solid #ffd54f;
    border-radius:8px; padding:6px 12px; pointer-events:none; font-size:.85rem;
    display:none; z-index:50; color:#ffd54f; font-weight:700; white-space:nowrap;
    box-shadow:0 4px 12px #000a;
  }

  #zoomControls {
    position:absolute; bottom:16px; right:16px; z-index:30;
    display:flex; flex-direction:column; gap:6px;
  }
  #zoomControls button {
    width:40px; height:40px; border-radius:10px; border:1px solid #2c3e50;
    background:#0f1622ee; color:#e0e0e0; cursor:pointer; font-size:1.2rem;
    font-weight:700; transition:.15s; backdrop-filter:blur(6px);
  }
  #zoomControls button:hover { border-color:#ffd54f; color:#ffd54f; }

  #gameMap { position:absolute; inset:0; background:#0d1622; overflow:hidden; }
  #gameMap svg { width:100%; height:100%; }
  .gameCountry { stroke:#0a0e17; stroke-width:0.5; }
  .gameCountry.home { stroke:#ffd54f; stroke-width:1.5; filter:drop-shadow(0 0 8px #ffd54f); }

  #flagBox {
    position:absolute; top:14px; left:14px; z-index:20;
    background:#0f1622ee; border:1px solid #ffd54f88; border-radius:12px;
    padding:10px 16px; display:flex; align-items:center; gap:12px;

  #flagBox .info .name { font-weight:700; color:#ffd54f; font-size:1rem; }
  #flagBox .info .bonus { font-size:.72rem; color:#90a4ae; }

  #timeBar {
    position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:20;

  .speedBtn {

  #resources .row span:last-child.flash { color:#66bb6a; }
  #resources .row.income span:last-child { color:#66bb6a; }

  .actionBtn.primary { border-color:#ffd54f; color:#ffd54f; }

/* ============================================================
   رنگ پایدار برای هر کشور (hash-based)
   ============================================================ */
function colorForCountry(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) {
    hash = ((hash << 5) - hash) + name.charCodeAt(i);
    hash |= 0;
  }
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 35%, 28%)`;
}

/* ============================================================
   بارگذاری اسکریپت
   ============================================================ */
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

/* ============================================================
   تبدیل TopoJSON به مسیرهای SVG
   ============================================================ */
async function initMap() {
  await loadScript(TOPO_URL);
  const topo = await fetch(MAP_URL).then(r => r.json());
  const geo = topojson.feature(topo, topo.objects.countries);

  const W = 1000, H = 500;
  const project = (lon, lat) => [
    (lon + 180) / 360 * W,
    (90 - lat) / 180 * H
  ];

  const countries = [];

  geo.features.forEach(f => {
    const name = f.properties.name || '';
    if (!name || name === 'Antarctica') return;

    const geom = f.geometry;
    if (!geom) return;

    let d = '';
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    let totalArea = 0;

    const coords = geom.type === 'Polygon' ? [geom.coordinates] :
                   geom.type === 'MultiPolygon' ? geom.coordinates : [];

    coords.forEach(polygon => {
      polygon.forEach((ring, ringIdx) => {
        let ringArea = 0;
        let px = 0, py = 0;
        ring.forEach((pt, i) => {
          const [x, y] = project(pt[0], pt[1]);
          d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
          if (ringIdx === 0) {
            if (x < minX) minX = x; if (y < minY) minY = y;
            if (x > maxX) maxX = x; if (y > maxY) maxY = y;
          }
          px += x; py += y;
        });
        d += 'Z';
        // محاسبه مساحت تقریبی (shoelace)
        for (let i = 0; i < ring.length; i++) {
          const [x1, y1] = project(ring[i][0], ring[i][1]);
          const [x2, y2] = project(ring[(i+1) % ring.length][0], ring[(i+1) % ring.length][1]);
          ringArea += x1 * y2 - x2 * y1;
        }
        totalArea += Math.abs(ringArea / 2);
      });
    });

    if (!d) return;

    // مرکز جرم تقریبی (bbox center) برای برچسب
    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;

    countries.push({
      name,
      pathD: d,
      centerX: cx,
      centerY: cy,
      area: totalArea,
    });
  });

  state.countries = countries;
  renderSelectMap();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('selectScreen').style.display = 'flex';
  initZoomPan();
}

/* ============================================================
   رندر نقشه انتخاب
   ============================================================ */
function renderSelectMap() {
  const layer = document.getElementById('countriesLayer');
  layer.innerHTML = '';
  const tooltip = document.getElementById('tooltip');
  const container = document.getElementById('mapContainer');

  // پیدا کردن بزرگ‌ترین مساحت برای تعیین برچسب‌ها
  const maxArea = Math.max(...state.countries.map(c => c.area));

  state.countries.forEach(c => {
    const info = COUNTRY_INFO[c.name];
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', c.pathD);
    p.setAttribute('class', 'countryHit' + (info ? ' selectable' : ''));
    p.setAttribute('fill', info ? colorForCountry(c.name) : '#1a2634');
    p.dataset.name = c.name;

    if (info) {
      p.addEventListener('mouseenter', () => {
        tooltip.style.display = 'block';
        tooltip.textContent = `${info.flag} ${info.name} — ${info.bonus}`;
      });
      p.addEventListener('mousemove', e => {
        const rect = container.getBoundingClientRect();
        tooltip.style.left = (e.clientX - rect.left + 14) + 'px';
        tooltip.style.top  = (e.clientY - rect.top  + 14) + 'px';
      });
      p.addEventListener('mouseleave', () => tooltip.style.display = 'none');
      p.addEventListener('click', e => {
        e.stopPropagation();
        if (state.dragged) return; // جلوگیری از کلیک بعد از درگ
        selectCountry(c.name);
      });
    }
    layer.appendChild(p);
  });

  // برچسب‌ها روی کشورهای شناخته‌شده با مساحت کافی
  state.countries.forEach(c => {
    const info = COUNTRY_INFO[c.name];
    if (!info) return;
    if (c.area < maxArea * 0.003) return; // خیلی کوچک

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', c.centerX);
    text.setAttribute('y', c.centerY);
    text.setAttribute('class', 'countryLabel');
    text.textContent = info.name;
    layer.appendChild(text);
  });

  // نمایش برچسب‌ها وقتی زوم کافی شد
  updateLabelVisibility();
}

function updateLabelVisibility() {
  const labels = document.querySelectorAll('.countryLabel');
  const show = state.zoom.scale > 1.3;
  labels.forEach(l => l.classList.toggle('visible', show));
}

/* ============================================================
   زوم و پن با ماوس
   ============================================================ */
let isDragging = false;
let dragStart = { x:0, y:0, tx:0, ty:0 };

function applyTransform() {
  const g = document.getElementById('countriesLayer');
  if (!g) return;
  g.setAttribute('transform',
    `translate(${state.zoom.tx}, ${state.zoom.ty}) scale(${state.zoom.scale})`);
  updateLabelVisibility();
}

function initZoomPan() {
  const container = document.getElementById('mapContainer');
  const svg = document.getElementById('worldMap');

  // زوم با wheel
  container.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    // مختصات در viewBox
    const vb = svg.viewBox.baseVal;
    const px = mx / rect.width * vb.width;
    const py = my / rect.height * vb.height;

    const delta = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    const newScale = Math.max(0.5, Math.min(15, state.zoom.scale * delta));
    const ratio = newScale / state.zoom.scale;

    // زوم حول نقطه ماوس
    state.zoom.tx = px - (px - state.zoom.tx) * ratio;
    state.zoom.ty = py - (py - state.zoom.ty) * ratio;
    state.zoom.scale = newScale;

    applyTransform();
  }, { passive: false });

  // درگ با ماوس
  container.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    isDragging = true;
    state.dragged = false;
    container.classList.add('dragging');
    dragStart = {
      x: e.clientX,
      y: e.clientY,
      tx: state.zoom.tx,
      ty: state.zoom.ty,
    };
  });

  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) state.dragged = true;

    const rect = container.getBoundingClientRect();
    const vb = svg.viewBox.baseVal;
    const sx = vb.width / rect.width;
    const sy = vb.height / rect.height;

    state.zoom.tx = dragStart.tx + dx * sx;
    state.zoom.ty = dragStart.ty + dy * sy;
    applyTransform();
  });

  window.addEventListener('mouseup', () => {
    if (!isDragging) return;
    isDragging = false;
    container.classList.remove('dragging');
    // تأخیر کوتاه تا کلیک بعد از درگ نادیده گرفته شود
    setTimeout(() => { state.dragged = false; }, 50);
  });

  // دکمه‌های زوم
  document.getElementById('zoomIn').onclick = () => zoomAt(1.3);
  document.getElementById('zoomOut').onclick = () => zoomAt(1/1.3);
  document.getElementById('zoomReset').onclick = () => {
    state.zoom = { scale: 1, tx: 0, ty: 0 };
    applyTransform();
  };
}

function zoomAt(factor) {
  const svg = document.getElementById('worldMap');
  const vb = svg.viewBox.baseVal;
  const cx = vb.width / 2;
  const cy = vb.height / 2;
  const newScale = Math.max(0.5, Math.min(15, state.zoom.scale * factor));
  const ratio = newScale / state.zoom.scale;

  state.zoom.tx = cx - (cx - state.zoom.tx) * ratio;
  state.zoom.ty = cy - (cy - state.zoom.ty) * ratio;
  state.zoom.scale = newScale;
  applyTransform();
}

/* ============================================================
   انتخاب کشور
   ============================================================ */
function selectCountry(name) {
  const info = COUNTRY_INFO[name];
  if (!info) return;

  state.country = { name, ...info };

  document.getElementById('flagIcon').textContent = info.flag;
  document.getElementById('flagName').textContent = info.name;
  document.getElementById('flagBonus').textContent = info.bonus;

  // رندر نقشه بازی
  const gameLayer = document.getElementById('gameCountriesLayer');
  gameLayer.innerHTML = '';
  const maxArea = Math.max(...state.countries.map(c => c.area));
  state.countries.forEach(c => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', c.pathD);
    p.setAttribute('class', 'gameCountry' + (c.name === name ? ' home' : ''));
    p.setAttribute('fill', c.name === name ? '#ffd54f' : colorForCountry(c.name));
    gameLayer.appendChild(p);
  });

  const ss = document.getElementById('selectScreen');
  ss.style.opacity = '0';
  setTimeout(() => {
    ss.style.display = 'none';
    document.getElementById('game').style.display = 'block';
    updateUI();
    state.lastFrame = performance.now();
    requestAnimationFrame(gameLoop);
  }, 500);
}

/* ============================================================
   بقیه منطق بازی (بدون تغییر)
   ============================================================ */
const modal = document.getElementById('modal');
const modalBox = document.getElementById('modalBox');
function openModal(html) { modalBox.innerHTML = html; modal.style.display = 'flex'; }
function closeModal() { modal.style.display = 'none'; }
modal.onclick = e => { if (e.target === modal) closeModal(); };

document.getElementById('buildCompanyBtn').onclick = () => {
  if (state.company) { toast('شما قبلاً کمپانی دارید!', true); return; }
  let html = `<h2>🏗 انتخاب نوع کمپانی</h2>`;
  COMPANIES.forEach(c => {
    html += `<div class="companyOption" onclick="createCompany('${c.id}')">
      <div class="title">${c.title}</div>
      <div class="desc">${c.desc}</div>
    </div>`;
  });
  html += `<button class="close" onclick="closeModal()">انصراف</button>`;
  openModal(html);
};

function createCompany(id) {
  const def = COMPANIES.find(c => c.id === id);
  state.company = { ...def, level: 1 };
  closeModal();

  document.getElementById('buildCompanyBtn').disabled = true;
  document.getElementById('assetsToggleBtn').disabled = false;
  document.getElementById('upgradeBtn').disabled = false;

  if (def.canBuyMine) {
    document.getElementById('buyMineBtn').disabled = false;
    document.getElementById('buyMineBtn').textContent =
      def.id === 'oil' ? '🛢 خرید چاه نفت (۵,۰۰۰)' : '⛏ خرید معدن (۵,۰۰۰)';
  } else {
    document.getElementById('buyMineBtn').disabled = true;
    document.getElementById('buyMineBtn').textContent = '⛏ خرید معدن (نیاز به شرکت معدنی)';
  }

  toast(`کمپانی ${def.title} ساخته شد!`);
  updateUI();
}

const MINE_COST = 5000;
document.getElementById('buyMineBtn').onclick = () => {
  if (!state.company || !state.company.canBuyMine) {
    toast('فقط شرکت معدنی/نفتی می‌تواند معدن بخرد', true); return;
  }
  if (state.money < MINE_COST) { toast('پول کافی ندارید!', true); return; }
  state.money -= MINE_COST;
  const income = Math.floor(80 + Math.random() * 120);
  const label = state.company.id === 'oil' ? 'چاه نفت' : 'معدن';
  state.assets.push({ income, type: label, id: Date.now() });
  toast(`${label} جدید خریداری شد! (+${income}/ماه)`);
  updateUI();
};

document.getElementById('upgradeBtn').onclick = () => {
  if (!state.company) return;
  const cost = state.company.upgradeCost * state.company.level;
  if (state.money < cost) { toast(`پول کافی ندارید! نیاز: ${cost.toLocaleString('en-US')}`, true); return; }
  state.money -= cost;
  state.company.level += 1;
  toast(`کمپانی به سطح ${state.company.level} ارتقاء یافت!`);
  updateUI();
};

document.getElementById('assetsToggleBtn').onclick = () => {
  const p = document.getElementById('assetsPanel');
  p.style.display = p.style.display === 'block' ? 'none' : 'block';
  renderAssets();
};

function renderAssets() {
  const list = document.getElementById('assetsList');
  if (state.assets.length === 0) {
    list.innerHTML = `<div class="empty">هنوز دارایی‌ای ندارید.</div>`; return;
  }
  list.innerHTML = state.assets.map((a, i) =>
    `<div class="assetItem"><span>${a.type} #${i+1}</span><span class="income">+${a.income}/ماه</span></div>`
  ).join('');
}

document.querySelectorAll('.speedBtn').forEach(btn => {
  btn.onclick = () => {
    const s = parseInt(btn.dataset.speed);
    if (s === 0) {
      state.running = !state.running;
      btn.classList.toggle('active', !state.running);
      btn.textContent = state.running ? '⏸' : '▶';
      return;
    }
    state.speed = s;
    state.running = true;
    document.querySelector('[data-speed="0"]').textContent = '⏸';
    document.querySelector('[data-speed="0"]').classList.remove('active');
    document.querySelectorAll('.speedBtn').forEach(b => {
      if (b.dataset.speed !== '0') b.classList.remove('active');
    });
    btn.classList.add('active');
    state.timeAccumulator = 0;
  };
});

function gameLoop(now) {
  const dt = now - state.lastFrame;
  state.lastFrame = now;
  if (state.running) {
    state.timeAccumulator += dt * state.speed;
    while (state.timeAccumulator >= state.msPerMonth) {
      state.timeAccumulator -= state.msPerMonth;
      advanceMonth();
    }
  }
  requestAnimationFrame(gameLoop);
}

function advanceMonth() {
  state.date.setMonth(state.date.getMonth() + 1);
  let income = 0;
  if (state.company) {
    income += state.company.baseIncome * state.company.level;
    state.assets.forEach(a => income += a.income);
  }
  if (income > 0) {
    state.money += income;
    flashMoney();
  }
  const dateEl = document.getElementById('dateDisplay');
  dateEl.classList.add('tick');
  setTimeout(() => dateEl.classList.remove('tick'), 200);
  updateUI();
}

function flashMoney() {
  const el = document.getElementById('money');
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 300);
}

const monthsFa = ['ژانویه','فوریه','مارس','آپریل','مه','ژوئن','ژوئیه','اوت','سپتامبر','اکتبر','نوامبر','دسامبر'];
const toFa = n => n.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

function updateUI() {
  document.getElementById('money').textContent = toFa(state.money.toLocaleString('en-US'));
  document.getElementById('companyName').textContent = state.company ? state.company.title : '—';
  document.getElementById('assetCount').textContent = toFa(state.assets.length);
  let income = 0;
  if (state.company) {
    income += state.company.baseIncome * state.company.level;
    state.assets.forEach(a => income += a.income);
  }
  document.getElementById('income').textContent = toFa(income.toLocaleString('en-US'));
  const d = state.date;
  document.getElementById('dateDisplay').textContent =
    `${toFa(d.getDate())} ${monthsFa[d.getMonth()]} ${toFa(d.getFullYear())}`;
  if (state.company) {
    const cost = state.company.upgradeCost * state.company.level;
    document.getElementById('upgradeBtn').textContent =
      `⬆ ارتقاء (${toFa(cost.toLocaleString('en-US'))})`;
  }
}

let toastTimer;
function toast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', isError);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

document.addEventListener('keydown', e => {
  if (document.getElementById('game').style.display !== 'block') return;
  if (e.code === 'Space') { e.preventDefault(); document.querySelector('[data-speed="0"]').click(); }
  if (e.key === '1') document.querySelector('[data-speed="1"]').click();
  if (e.key === '2') document.querySelector('[data-speed="2"]').click();
  if (e.key === '3') document.querySelector('[data-speed="4"]').click();
  if (e.key === '4') document.querySelector('[data-speed="8"]').click();
});

window.createCompany = createCompany;
window.closeModal = closeModal;

initMap().catch(err => {
  document.getElementById('loading').innerHTML =
    `<p style="color:#ef5350">خطا: ${err.message}</p>
     <p style="color:#90a4ae;font-size:.8rem">اتصال اینترنت را بررسی کنید</p>`;
});
</script>
